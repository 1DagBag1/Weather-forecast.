<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    
    <header class="header">
        <h1 class="title">
            Прогноз погоды
        </h1>

        <form class="form">
            <input class="input" type="text" name="" id="" placeholder="Введите название города">
            <button class="btn">Показать</button>
        </form>
    </header>

    <div class="card">

        <h2 class="card-city">
            London <span>GB</span>
        </h2>

        <div class="card-weather">
            <div class="card-value">
                11<sup>°c</sup> 
            </div>

            <img src="imeg\i.png" alt="" class="card-img">
        </div>

        <div class="card-desc">Облачно</div>

    </div>

    <footer class="footer">
        <a href="https://github.com/1DagBag1" class="footer-text">
            <span>Создатель</span> DagBag (<span> Даниил </span>)
        </a>
    </footer>

    <script src="/js/script.js"></script>
</body>
</html>
